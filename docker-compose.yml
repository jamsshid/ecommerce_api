services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ecommerce_web
    restart: unless-stopped
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    volumes:
      - .:/app
      - /app/.venv
      - /app/staticfiles            
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SITE_URL: ${SITE_URL}
    depends_on:
      db:
        condition: service_healthy

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: ecommerce_stripe
    restart: unless-stopped
    command: >
      listen --api-key ${STRIPE_SECRET_KEY}
             --forward-to web:8000/cart/webhook/stripe/
    depends_on:
      - web

volumes:
  postgres_data:
